<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Noto Sans"; src: url("/assets/fonts/NotoSans.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
#cap { position: absolute; left: 0; right: 0; top: 43%; text-align: center; font: 900 86px "Noto Sans"; color: #fff;
  -webkit-text-stroke: 14px #1F1B18; paint-order: stroke fill; letter-spacing: 1px; }
#title { position: absolute; left: 60px; right: 60px; top: 190px; text-align: center; font: 900 96px/1.08 "Noto Sans"; color: #fff;
  -webkit-text-stroke: 16px #1F1B18; paint-order: stroke fill; }
#title b { color: #E0A63A; }
#wm { position: absolute; left: 0; right: 0; top: 62%; text-align: center; font: 700 26px "Noto Sans"; color: rgba(255,255,255,0.55); }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head><body><div id="title"></div><div id="cap"></div><div id="wm"></div>
<script type="module">
import * as THREE from 'three';
const ep = new URLSearchParams(location.search).get('ep');
const mod = await import(`/${ep}/scene3d.js`);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(42, 1080 / 1920, 0.1, 4000);
const api = await mod.setup({ THREE, renderer, camera, ep });
await document.fonts.load('900 86px "Noto Sans"');
const cap = document.getElementById('cap'), title = document.getElementById('title'), wm = document.getElementById('wm');
window.DURATION = api.duration;
window.renderAt = (t) => { const ui = api.frame(t) || {}; cap.textContent = ui.word || ''; title.innerHTML = ui.title || ''; wm.textContent = ui.wm || ''; renderer.render(api.scene, camera); };
window.READY = true;
</script></body></html>
